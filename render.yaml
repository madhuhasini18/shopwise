services:
  - type: web
    name: shopwise
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: shopwise-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/shopwise.db
      - key: SECRET_KEY
        generateValue: true
